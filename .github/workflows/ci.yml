name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "24.x"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  browser-smoke:
    name: Browser smoke
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: askora
          POSTGRES_PASSWORD: askora
          POSTGRES_DB: askora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U askora -d askora_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://askora:askora@127.0.0.1:5432/askora_ci
      DIRECT_DATABASE_URL: postgresql://askora:askora@127.0.0.1:5432/askora_ci
      APP_URL: http://127.0.0.1:5183
      BETTER_AUTH_URL: http://127.0.0.1:5183
      TRUSTED_ORIGINS: http://127.0.0.1:5183
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789
      NODE_ENV: test
      BETA_SEED_CONFIRM: reset-beta-fixtures
      BETA_SEED_SCOPE: test
      MIGRATION_REHEARSAL_CONFIRM: reset-schema
      QUESTION_GENERATION_ENCRYPTION_KEYS: '{"1":"BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc="}'
      QUESTION_GENERATION_ACTIVE_ENCRYPTION_KEY_VERSION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the 0017-to-latest migration transaction
        run: npm run db:verify-migration

      - name: Apply migrations for integration and browser tests
        run: npm run db:migrate

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e -- --workers=1

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
