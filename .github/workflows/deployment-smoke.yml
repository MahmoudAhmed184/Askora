name: Production deployment smoke

on:
  deployment_status:

permissions: {}

concurrency:
  group: production-smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production
    if: >-
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.state == 'success' &&
      startsWith(vars.PRODUCTION_URL, 'https://')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public page and database readiness
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          base_url="${PRODUCTION_URL%/}"

          curl \
            --fail \
            --location \
            --max-time 20 \
            --output /dev/null \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --show-error \
            --silent \
            "$base_url/"

          curl \
            --fail \
            --location \
            --max-time 20 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --show-error \
            --silent \
            "$base_url/up" \
            | node --input-type=module --eval '
                const chunks = [];
                for await (const chunk of process.stdin) chunks.push(chunk);
                const readiness = JSON.parse(Buffer.concat(chunks).toString());
                if (readiness.status !== "ok") process.exit(1);
              '
