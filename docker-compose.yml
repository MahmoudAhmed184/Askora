name: askora

services:
  postgres:
    image: postgres:17
    container_name: askora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: askora
      POSTGRES_USER: askora
      POSTGRES_PASSWORD: askora_local
    ports:
      - "5433:5432"
    volumes:
      - askora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askora -d askora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  askora_postgres_data:
